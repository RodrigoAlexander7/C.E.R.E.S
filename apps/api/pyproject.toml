[project]
name = "ceres-api"
version = "0.1.0"
description = "CERES Majes — API, motor de comparación de ciclos y asistente con evidencia"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pwdlib[argon2]==0.4.0",
    "httpx==0.28.1",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "openai==3.51.0",
    "google-genai==3.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "db: requiere PostgreSQL de pruebas (CERES_TEST_DATABASE_URL)",
]
