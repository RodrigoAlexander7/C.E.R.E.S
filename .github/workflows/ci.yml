name: CI

# Comprobaciones en pull requests (y reutilizadas por el despliegue antes de publicar).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — pruebas (PostgreSQL real)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ceres
          POSTGRES_PASSWORD: ceres_dev
          POSTGRES_DB: ceres_test
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U ceres -d ceres_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CERES_TEST_DATABASE_URL: postgresql+psycopg://ceres:ceres_dev@127.0.0.1:5440/ceres_test
      DATABASE_URL: postgresql+psycopg://ceres:ceres_dev@127.0.0.1:5440/ceres_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - name: Pruebas de dominio, integración y asistente (proveedor LLM simulado)
        run: uv run pytest -q
      - name: Migraciones coherentes con el modelo
        run: uv run alembic check

  web:
    name: Web — tipos y build de producción
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: E2E — recorrido de aceptación
    needs: [api, web]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ceres
          POSTGRES_PASSWORD: ceres_dev
          POSTGRES_DB: ceres
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U ceres -d ceres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ceres:ceres_dev@127.0.0.1:5440/ceres
      APP_ORIGIN: http://localhost:3000
      DEV_INSECURE_COOKIES: "true"
      REGIONS_LIVE_FETCH: "false"
      API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: API (migraciones, seed y servidor)
        working-directory: apps/api
        run: |
          uv sync --locked --no-dev
          uv run alembic upgrade head
          uv run python -m ceres.cli seed > /dev/null
          nohup uv run uvicorn tests.e2e_app:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
      - name: Web (build y servidor de producción)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run start > /tmp/web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/v1/health && break; sleep 2; done
      - name: Playwright
        working-directory: apps/web
        env:
          PW_CHANNEL: chromium
        run: npx playwright test
      - name: Logs si falla
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log

  images:
    name: Imágenes Docker (build sin publicar)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=web
